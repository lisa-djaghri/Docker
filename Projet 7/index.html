<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #1a1a2e; color: white; }
    h1 { margin-top: 40px; }
    #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 8px; margin: 30px auto; width: fit-content; }
    .cell { width: 100px; height: 100px; background: #16213e; border: 2px solid #0f3460; font-size: 2.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    .cell:hover { background: #0f3460; }
    #status { font-size: 1.4rem; margin: 10px; }
    button { padding: 10px 30px; font-size: 1rem; background: #e94560; border: none; color: white; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    #results { margin-top: 30px; }
    table { margin: auto; border-collapse: collapse; }
    th, td { padding: 8px 20px; border: 1px solid #0f3460; }
  </style>
</head>
<body>
  <h1>🎮 Tic Tac Toe</h1>
  <div id="status">Tour du joueur X</div>
  <div id="board"></div>
  <button onclick="resetGame()">Rejouer</button>

  <div id="results">
    <h2>📊 Résultats</h2>
    <table>
      <thead><tr><th>Gagnant</th><th>Date</th></tr></thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>

  <script>
    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;

    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function renderBoard() {
      const div = document.getElementById('board');
      div.innerHTML = '';
      board.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = val;
        cell.onclick = () => play(i);
        div.appendChild(cell);
      });
    }

    function play(i) {
      if (board[i] || gameOver) return;
      board[i] = currentPlayer;
      if (checkWin()) {
        document.getElementById('status').textContent = `🏆 Joueur ${currentPlayer} gagne !`;
        saveResult(currentPlayer);
        gameOver = true;
      } else if (board.every(c => c)) {
        document.getElementById('status').textContent = "🤝 Match nul !";
        saveResult('Nul');
        gameOver = true;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        document.getElementById('status').textContent = `Tour du joueur ${currentPlayer}`;
      }
      renderBoard();
    }

    function checkWin() {
      return wins.some(([a,b,c]) => board[a] && board[a] === board[b] && board[b] === board[c]);
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      document.getElementById('status').textContent = 'Tour du joueur X';
      renderBoard();
    }

    function saveResult(winner) {
      fetch('save.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ winner, date: new Date().toLocaleString() })
      }).then(() => loadResults());
    }

    function loadResults() {
      fetch('results.json').then(r => r.json()).then(data => {
        const tbody = document.getElementById('resultsBody');
        tbody.innerHTML = data.map(r => `<tr><td>${r.winner}</td><td>${r.date}</td></tr>`).join('');
      }).catch(() => {});
    }

    renderBoard();
    loadResults();
  </script>
</body>
</html>
